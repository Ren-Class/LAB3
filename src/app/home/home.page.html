<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Haptics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Haptics</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Haptics</ion-card-title>
      <ion-card-subtitle>Tap to feel each pattern</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <h3>Impact</h3>
      <div class="button-row">
        <ion-button fill="outline" (click)="impact(ImpactStyle.Light)">Light</ion-button>
        <ion-button fill="outline" (click)="impact(ImpactStyle.Medium)">Medium</ion-button>
        <ion-button fill="outline" (click)="impact(ImpactStyle.Heavy)">Heavy</ion-button>
      </div>

      <h3>Notification</h3>
      <div class="button-row">
        <ion-button color="success" (click)="notify(NotificationType.Success)">Success</ion-button>
        <ion-button color="warning" (click)="notify(NotificationType.Warning)">Warning</ion-button>
        <ion-button color="danger" (click)="notify(NotificationType.Error)">Error</ion-button>
      </div>

      <h3>Other</h3>
      <div class="button-row">
        <ion-button color="medium" (click)="vibrate()">Vibrate</ion-button>
        <ion-button color="medium" (click)="selectionDemo()">Selection ticks</ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
